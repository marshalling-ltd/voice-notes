[package]
name = "voice-notes"
version = "0.1.0"
edition = "2024"
authors = ["marshalling"]
publish = false

[dependencies]
hound = "3.5"
reqwest = { version = "0.13", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18.2"
ratatui = "0.30.2"
crossterm = "0.29"
serde_json = "1.0.154"

# PipeWire/PulseAudio microphone access is Linux-only; macOS uses CoreAudio.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
