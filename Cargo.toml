[package]
name = "voice-notes"
version = "0.1.0"
edition = "2024"
authors = ["marshalling"]
publish = false

[dependencies]
hound = "3.5"
reqwest = { version = "0.13", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
