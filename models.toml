# The models voice-notes knows about, and which ones each size class starts with.
#
# Embedded in the program (src/catalogue.rs parses it), and checked by `cargo test`: every entry
# must be complete, every set must name existing models, and no set may contain a model that is
# too big for its class.
#
# Each [[model]]:
#   id          short unique name; sets refer to it
#   name        what people see
#   role        speech-to-text | chat | text-to-speech
#   class       the smallest size class that should run it: minimal | light | standard | power
#   url         https download address, at a fixed commit rather than a branch (stack/MODEL_HOSTING.md)
#   sha256      of the file, 64 lowercase hex digits; the download is checked against it
#   size_bytes  exact size of the file
#   licence     licence name, shown before anything is downloaded
#   licence_url where to read it
#
# Sizes and sha256 values are those published by the model host (checked 2026-11-14). Licences are
# as stated on each model card; they were not independently audited.
#
# The default sets follow the project's hardware table: Whisper small with a 4B chat model for
# `minimal`; Whisper large-v3-turbo with 8B for `light` and 14B for `standard`; and for `power`
# Qwen3-Coder-30B-A3B as the fast model plus a reasoning model. Kokoro speaks in every class; its
# weights ship inside its container image, so the stack does not download this file (macOS does).
# The stack's own sets (stack/profiles) are chosen for CPU speed and differ on purpose; see
# stack/README.md.

[meta]
checked = "2026-11-14"

[[model]]
id = "whisper-small"
name = "Whisper small"
role = "speech-to-text"
class = "minimal"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small.bin"
sha256 = "1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b"
size_bytes = 487601967
licence = "MIT"
