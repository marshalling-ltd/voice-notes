# What each size class starts with, by job. A reasoning model is a chat model used for the
# `smart` and `think` profiles; only `power` has room for one next to the fast model.

[sets.minimal]
speech-to-text = "whisper-small"
chat = "qwen3-4b"
text-to-speech = "kokoro-v1_0"

[sets.light]
speech-to-text = "whisper-large-v3-turbo-q5_0"
chat = "qwen3-8b"
text-to-speech = "kokoro-v1_0"

[sets.standard]
speech-to-text = "whisper-large-v3-turbo-q5_0"
chat = "qwen3-14b"
text-to-speech = "kokoro-v1_0"

[sets.power]
speech-to-text = "whisper-large-v3-turbo-q5_0"
chat = "qwen3-coder-30b-a3b"
reasoning = "qwen3-14b"
text-to-speech = "kokoro-v1_0"
