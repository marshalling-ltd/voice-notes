# llama-swap configuration for the `standard` size class (see standard.toml).
# File names must match the files that fetch_models.py puts into /models.

healthCheckTimeout: 600

models:
  # Speech to text. The name is what the client sends as the model (its default is "whisper").
  # --tmp-dir: --convert writes temporary files, and the working directory (/models) is read-only.
  whisper:
    ttl: 600
    cmd: >
      whisper-server
      --host 127.0.0.1 --port ${PORT}
      -m /models/ggml-small.bin
      --inference-path /v1/audio/transcriptions
      --convert --tmp-dir /tmp

  # Chat. Use it with: voice-notes --chat-model qwen3-14b
  qwen3-14b:
    ttl: 600
    cmd: >
      llama-server
      --host 127.0.0.1 --port ${PORT}
      -m /models/Qwen3-14B-Q4_K_M.gguf
      --jinja -c 8192

# Keep both loaded, so a voice turn does not pay for swapping models (see ../llama-swap.yaml).
groups:
  voice:
    swap: false
    exclusive: false
    members:
      - "whisper"
      - "qwen3-14b"
